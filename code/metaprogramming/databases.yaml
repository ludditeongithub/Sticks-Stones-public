databases:
    animal:
        name: animal
        traits: [health, hunger, sex, age, targeting, movable, positional, searchable]
        extra_arrays: [animal_status]
        database_references: []
    buildable:
        name: buildable
        traits: [health, positional]
    item:
        name: item
        traits: [positional, searchable]
    unit:
        name: unit
        traits: [health, hunger, sex, age, targeting, movable, positional, searchable]
        extra_arrays: [role_mana, role_list, skin_data, skill, inventory, place]
    tile:
        name: tile
        traits: [immortal]
    plant:
        name: plant
        traits: [positional, age, searchable]
        database_references: [seed, tile, animal]
    seed:
        name: seed
        traits: [positional, age, foreign_enum]
        foreign_enum: [plant]
    
    vehicle:
        name: vehicle
        traits: [health, movable, positional, seats]
        database_references: [unit]

trait_data:
  - trait_name: age
    name: ages
    type: Time
    newborn_default: 0
    random_age_default: age

  - trait_name: health
    name: healths
    type: Health
    newborn_default: maxHealths[{{ entity_name }}] * INFANT_HEALTH_MODIFIER
    random_age_default: getMaxHealth(age)

  - trait_name: hunger
    name: hungers
    type: Hunger
    newborn_default: maxHungers[{{ entity_name }}] * INFANT_HUNGER_MODIFIER
    random_age_default: getMaxHunger(age)

  - trait_name: movable
    name: frameDatas
    type: FrameData
    newborn_default: FrameData{ActState::NONE, Direction::South, 0}
    random_age_default: FrameData{ActState::NONE, Direction::South, 0}

  - trait_name: positional
    name: coords
    type: Coord
    newborn_default: coord
    random_age_default: coord

  - trait_name: targeting
    name: targets
    type: size_t
    newborn_default: std::numeric_limits<size_t>::max()
    random_age_default: std::numeric_limits<size_t>::max()

  - trait_name: targeting
    name: targetTypes
    type: TargetType
    newborn_default: TargetType::NONE
    random_age_default: TargetType::NONE

  - trait_name: targeting
    name: actions
    type: Action
    newborn_default: Action::NONE
    random_age_default: Action::NONE

  - trait_name: sex
    name: sexes
    type: Sex
    newborn_default: random_bool->next()
    random_age_default: random_bool->next()

extra_arrays:
  - id: animal_status
    name: animalStatuses
    type: AnimalStatus
    newborn_default: AnimalStatus{Direction::North, ActionStatus::Idle, MatingStatus::Idle}
    random_age_default: AnimalStatus{Direction::North, ActionStatus::Idle, MatingStatus::Idle}
  - id: skin_data
    name: skinDatas
    type: SkinData
    newborn_default: {generateMelanin(parent1, parent2), generateSkinWarmth(parent1, parent2), 0.5, 0.0}
    random_age_default: {generateMelanin(world, coord), generateSkinWarmth(world, coord), 0.5, 0.0}
  - id: role_list
    name: roleLists
    type: std::array<Role, ROLE_MAX>
    newborn_default: std::array<Role, ROLE_MAX>{}
    random_age_default: std::array<Role, ROLE_MAX>{} # TODO: maybe function to generate Role from list of unlocked roles
  - id: role_mana # OPTI: can be just deduced from role list
    name: roleManas
    type: RoleMana
    newborn_default: STARTING_ROLE_MANA
    random_age_default: STARTING_ROLE_MANA    
  - id: inventory
    name: inventories
    type: Inventory
    newborn_default: Inventory{}
    random_age_default: Inventory{}
  - id: skill
    name: skills
    type: Skills{}
    newborn_default: Skills{}
    random_age_default: Skills{}
  - id: place
    name: places
    type: Places
    newborn_default: Places{}
    random_age_default: Places{}
  