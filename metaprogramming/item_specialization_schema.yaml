# TODO: application of default values, also in j2
# OPTI: AoS mode
schema:
        wearable:
                layout: aos
                special_cases:
                constants:
                    toughness: float
                    durability: float
                    bulk: float
                    weight: Weight
                    bulk_level: BulkLevel::Solid
                    min_temp: Temp
                    max_temp: Temp                    
                    covers: BitsetTable<BodyArea>
                fields:
                    health: Health
                    quality: Quality
                    equipped: bool
        perishable:
                layout: soa
                special_cases:
                constants:
                        enjoyment: FoodEnjoyment
                        nutrition: float                        
                        fridge_temp: Temp
                        cooling_effect: float
                        fermentable: bool
                        decay_period: Time
                        disease_risk: float # higher risk = more serious
                fields:
                        decay: float
                        preservation_state: PreservationState                        
        container:
                layout: aos
                special_cases:
                constants:
                        capacity_weight: float
                        capacity_bulk: float
                fields:
        art:
                special_cases:
                constants:
                        base_beauty: float
                        avant_garde_factor: float
                        # TODO: skill ratios
                fields:
        scavengeable:
                layout: 
                special_cases:
                constants:                       
                        variant: Variant
                fields:

specialization_fields:
        decay:
                type: float

